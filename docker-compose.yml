services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d argus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-argus}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-argus-dev-only}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    mem_limit: 768m
    memswap_limit: 768m
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/argus
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      ENVIRONMENT: development
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      # Object storage (MinIO in dev; swap endpoint+keys for AWS S3 in prod)
      ARGUS_S3_ENDPOINT: http://minio:9000
      ARGUS_S3_PUBLIC_ENDPOINT: http://localhost:9000
      ARGUS_S3_REGION: us-east-1
      ARGUS_S3_BUCKET: argus-sources
      ARGUS_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-argus}
      ARGUS_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-argus-dev-only}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >-
      celery -A tasks.pipeline:celery_app worker --loglevel=info
      --concurrency=2 --max-memory-per-child=400000
    mem_limit: 1500m
    memswap_limit: 1500m
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/argus
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      ENVIRONMENT: development
      ARGUS_S3_ENDPOINT: http://minio:9000
      ARGUS_S3_PUBLIC_ENDPOINT: http://localhost:9000
      ARGUS_S3_REGION: us-east-1
      ARGUS_S3_BUCKET: argus-sources
      ARGUS_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-argus}
      ARGUS_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-argus-dev-only}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # Week 2 / Day 1 — DeBERTa NLI cross-encoder runs in its own Celery worker so
  # the model loads exactly once per process (concurrency=1) and the main worker
  # never blocks on a 440MB model load. Listens only on the `nli` queue so
  # tasks.pipeline tasks routed to the default queue don't accidentally land
  # here (and vice versa). Day 3 wires it into the verifier; today it's
  # smoke-only.
  nli_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # --max-tasks-per-child=1000000 overrides the global
    # worker_max_tasks_per_child=1 so the DeBERTa model stays loaded across
    # tasks (a fresh fork would have to re-init the ~440MB cross-encoder for
    # every score_pairs call). Celery 5.3.6 rejects 0 (assertion `maxtasks > 0`
    # in billiard.pool.__init__), and there is no CLI way to express "never
    # recycle"; 1M effectively means "for the lifetime of the worker process".
    command: >-
      celery -A tasks.pipeline:celery_app worker --loglevel=info
      --concurrency=1 --queues=nli --hostname=nli@%h
      --max-tasks-per-child=1000000
    mem_limit: 1500m
    memswap_limit: 1500m
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/argus
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    # Bind-mount the backend source so smoke-test fixture / deberta_client
    # / nli task edits don't require an image rebuild. The HuggingFace
    # cache stays inside the image (preloaded by Dockerfile RUN). Restart
    # the worker after editing core/ or tasks/ to reload Python modules.
    # tools/ is mounted (read-only) so check_nli_perf.py runs in-process
    # against the same Python interpreter that owns the loaded model.
    volumes:
      - ./backend:/app
      - ./tools:/repo_tools:ro
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
