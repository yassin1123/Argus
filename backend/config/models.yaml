default:
  model: openai/gpt-4o
  temperature: 0.3
  max_tokens: 4096
  timeout_seconds: 120
  fallback_model: null
  structured_required: false

tasks:
  intake:
    model: openai/gpt-4o-mini
    fallback_model: anthropic/claude-haiku-4-5
    temperature: 0.2
    max_tokens: 2048
    timeout_seconds: 45
    structured_required: true

  conversation:
    model: anthropic/claude-haiku-4-5
    fallback_model: openai/gpt-4o-mini
    temperature: 0.2
    max_tokens: 1200
    timeout_seconds: 45
    structured_required: true

  planner:
    model: openai/gpt-4o
    fallback_model: anthropic/claude-sonnet-4-5
    temperature: 0.3
    max_tokens: 4096
    timeout_seconds: 120

  researcher:
    model: openai/gpt-4o
    fallback_model: anthropic/claude-sonnet-4-5
    temperature: 0.25
    max_tokens: 8192
    timeout_seconds: 180

  research_subagent:
    model: openai/gpt-4o-mini
    fallback_model: anthropic/claude-haiku-4-5
    temperature: 0.2
    max_tokens: 4096
    timeout_seconds: 90

  # Day 3 cross-family wedge: analyst and writer must NOT fall back to a
  # provider family already in the verifier chain (openai primary + google
  # fallback). Falling back to openai/gpt-4o would let the openai verifier
  # judge openai analyst output — same-family verification, the failure
  # mode the wedge exists to prevent. Intra-family fallback to claude-haiku-4-5
  # is weaker on capability but preserves the cross-family contract.
  analyst:
    model: anthropic/claude-sonnet-4-5
    fallback_model: anthropic/claude-haiku-4-5
    temperature: 0.25
    max_tokens: 8192
    timeout_seconds: 180
    structured_required: true

  critic:
    model: anthropic/claude-sonnet-4-5
    fallback_model: openai/gpt-4o
    temperature: 0.5
    max_tokens: 4096
    timeout_seconds: 120

  verifier:
    model: openai/gpt-4o
    fallback_model: google/gemini-2.5-pro
    temperature: 0.05
    max_tokens: 4096
    timeout_seconds: 90
    structured_required: true

  writer:
    model: anthropic/claude-sonnet-4-5
    fallback_model: anthropic/claude-haiku-4-5
    temperature: 0.35
    max_tokens: 8192
    timeout_seconds: 180
    structured_required: true

  entailment:
    model: openai/gpt-4o-mini
    temperature: 0.0
    max_tokens: 2048

  long_context:
    model: google/gemini-2.5-pro
    temperature: 0.2
    max_tokens: 8192
    timeout_seconds: 240
