# Required research dimensions (branch ids) per mode. Missing -> insufficient gap hints.
general:
  label: General decision support
  required_branches: []
  min_evidence_objects: 0

market_entry:
  label: Market entry
  required_branches:
    - market
    - competition
    - regulation
  min_evidence_objects: 2

due_diligence:
  label: Due diligence
  required_branches:
    - financial
    - legal
    - operational
  min_evidence_objects: 3

growth_strategy:
  label: Growth strategy
  required_branches:
    - market
    - capabilities
  min_evidence_objects: 2
  # W8/D4: growth-strategy memos must run Porter's Five Forces on
  # the target market — without an industry-attractiveness frame the
  # "should we grow here" recommendation has no analytical anchor.
  # Value Chain + 2x2 are available for the writer if the analyst
  # surfaced enough material; not enforced.
  frameworks:
    required:
      - porters_five_forces
    optional:
      - value_chain
      - two_by_two
  # W14/D1: close the W8 Run B writer-truncation carry-forward.
  #
  # Diagnosis (static + DB telemetry, no diagnose run spent):
  # - Past writer call on the W8 demo session
  #   (bcb54507-31fc-4069-8c0d-585d075b0d07) used
  #   anthropic/claude-sonnet-4-5 and emitted exactly 8174
  #   completion_tokens — Sonnet 4.5's default 8192-token ceiling.
  # - growth_strategy carried no model_overrides, so the writer ran
  #   on the layered default (Sonnet 4.5) with no max_tokens lift.
  # - The Porter's Five Forces block (5 forces × rationale +
  #   key_drivers + evidence_citations) reliably overflows that
  #   ceiling on top of the base memo sections.
  # - The Anthropic extended-output beta header was tried in W7 and
  #   rejected by the API (litellm_client._extra_headers_for still
  #   returns {} as a no-op for that reason). So a max_tokens > 8192
  #   on Sonnet won't be honoured.
  #
  # Path A fix (proven W7 pattern — same shape as the m_and_a_diligence
  # override below): swap the writer to gpt-4o, which doesn't hit the
  # 8192 ceiling, with an explicit max_tokens floor of 16000 so the
  # extended structured output has headroom for the framework block on
  # top of base sections. Critic/analyst stay on the layered default
  # for growth — only the writer's payload size is the bottleneck on
  # this mode. If we see truncation drift to those tasks later, we'll
  # add the same overrides as M&A did in iterate-4.
  model_overrides:
    writer:
      model: openai/gpt-4o
      max_tokens: 16000

# Phase 2 / Week 7 / Day 2 — first built-in mode shipping with the
# richer schema fields (display_name, description, reasoning_slots,
# source_priorities_default, trust_tier_rules, metadata).
# Pairs with MAndADiligenceReportPayload in agents/writer/schemas/_m_and_a.py
# (registered for this slug in agents/writer/schemas/_registry.py).
m_and_a_diligence:
  display_name: "M&A diligence"
  description: |
    Diligence assessment of an acquisition target. Quantifies deal economics
    (synergies, valuation range, risks), defines integration plan, and
    recommends deal structure. Anchored to a CIM or equivalent target data.
  required_branches:
    - financial_due_diligence       # P&L quality, working capital, debt
    - commercial_due_diligence      # market position, customer concentration, contract base
    - operational_due_diligence     # capex, IT, key dependencies, scalability
    - synergy_quantification        # revenue + cost + dis-synergies, with basis
    - valuation_triangulation       # DCF + comparable transactions + trading comps
    - integration_risk_assessment   # complexity, deal-breakers, post-close priorities
  reasoning_slots:
    - target_strategic_fit
    - deal_economics
    - value_creation_thesis
    - integration_complexity
    - deal_breakers
    - post_close_priorities
  source_priorities_default:
    - uploaded        # CIM, financial model, management presentations
    - sec_filing      # 10-K, 10-Q, 8-K for context on listed comparables and target if listed
    - transcript      # earnings calls of comparable companies
    - news            # M&A market context, recent transactions, sector conditions
  trust_tier_rules:
    uploaded: firm_vetted        # CIM is treated as authoritative; consultant has reviewed
    sec_filing: firm_vetted
    transcript: firm_vetted
    news: web_general
  min_evidence_objects: 4
  metadata:
    schema_version: "1.0"
    writer_payload_class: "MAndADiligenceReportPayload"
  # W7/iterate (pivot + iterate-4): Sonnet 4.5's 8192-token default
  # per-response cap was the proximate cause of writer truncation on
  # the seven-section M&A schema. The beta header path (extended-
  # output-128k-2025-02-19) was attempted but rejected by the
  # Anthropic API at runtime. Per the iterate-spec pivot rule, the
  # writer swapped to gpt-4o.
  #
  # Iterate-4 extends the same pivot to analyst + critic — both
  # produced JSON-truncated structured outputs in iterate-3 e2e runs
  # under the 128-evidence-chunk load (analyst: Anthropic timeout;
  # critic: 3× truncated lists). Same root cause as the writer's
  # original failure (long structured payload + 8192-token ceiling),
  # same fix shape (model_overrides[task] = gpt-4o). Verifier keeps
  # default routing — its structured output is shorter and hasn't
  # shown the same flake pattern.
  model_overrides:
    writer:
      model: openai/gpt-4o
    analyst:
      model: openai/gpt-4o
    critic:
      model: openai/gpt-4o
  # W8/D4: M&A diligence memos must include a 2x2 of the deal's key
  # tiles (target capabilities, sub-options, segments) plotted against
  # deal complexity vs strategic fit. Porter's Five Forces is
  # available when the target's market analysis is rich enough but
  # not enforced — many M&A briefs are about the target itself, not
  # the surrounding market structure.
  frameworks:
    required:
      - two_by_two
    optional:
      - porters_five_forces
