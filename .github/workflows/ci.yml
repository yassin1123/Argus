name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Download the en_core_web_sm spaCy model so the lexical-overlap
          # tests (Week 2 Day 2) can load it. ~50MB; the Dockerfile does
          # the same step for runtime images, but the CI pytest job runs
          # against host Python (actions/setup-python), not the image.
          python -m spacy download en_core_web_sm

      - name: Run pytest (DB-free unit tests only)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://noop:noop@localhost:5432/noop
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEMO_MODE: "1"
        run: |
          # Skip tests that require live DB / external network. The rest of the suite
          # runs as fast unit tests against fixtures + pure functions. Multi-provider
          # smoke tests skip themselves cleanly when the matching key is unset, so PRs
          # from forks (no secrets) still pass. The DeBERTa NLI smoke test pulls
          # ~1GB of torch + sentence-transformers and is run inside the nli_worker
          # container by an operator, not in the lightweight pytest CI step.
          pytest tests \
            --ignore=tests/test_planner_openai.py \
            --ignore=tests/test_retrieval_hybrid.py \
            --ignore=tests/test_research_dedupe.py \
            --ignore=tests/test_nli_deberta_smoke.py \
            --ignore=tests/test_edgar_ingest.py \
            --ignore=tests/test_firm_library_service.py \
            --ignore=tests/test_firm_library_permissions.py \
            --ignore=tests/test_firm_library_retrieval.py \
            --ignore=tests/test_firm_modes_api.py \
            --ignore=tests/test_get_session_row_firm_id.py \
            -q --tb=short

  frontend-build:
    name: Frontend · type-check + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build (production)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  docker-compose-smoke:
    name: Docker Compose · demo smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Boot demo stack
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build db redis backend
          # Wait for backend health (up to ~90s).
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/health > /dev/null; then
              echo "backend healthy after ${i}s polling"
              exit 0
            fi
            sleep 3
          done
          echo "backend did not become healthy"
          docker compose logs backend
          exit 1

      - name: Verify health endpoint
        run: |
          curl -fsS http://localhost:8000/api/health | tee health.json
          grep -q '"status"' health.json
          grep -q '"ok"' health.json

      - name: Run demo seeder
        run: |
          docker compose -f docker-compose.yml -f docker-compose.demo.yml run --rm seed

      - name: Verify seeded sessions are visible
        run: |
          curl -fsS http://localhost:8000/api/sessions | tee sessions.json
          # Three demo engagements expected.
          test "$(grep -o '"id"' sessions.json | wc -l)" -ge 3

      - name: Verify Germany-vs-France graph endpoint returns nodes
        run: |
          curl -fsS http://localhost:8000/api/workspaces/11111111-1111-4111-8111-111111111111/graph \
            | tee graph.json
          # At minimum we expect nodes, edges, stats.
          grep -q '"nodes"' graph.json
          grep -q '"stats"' graph.json
          grep -q '"supported"' graph.json

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.demo.yml down -v
